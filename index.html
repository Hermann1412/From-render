<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Webform_assignment</title>
  <style>
    /* Simple styling for clarity; can be customized or removed */
    form { max-width: 600px; margin: 0 auto; padding: 16px; border: 1px solid #ccc; }
    fieldset { margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; }
    label { display: block; margin-bottom: 6px; }
    input[type="text"], input[type="number"], textarea, input[type="file"] {
      width: 100%; padding: 8px; box-sizing: border-box;
    }
    .inline { display: inline-block; margin-right: 10px; }
  </style>
</head>
<body>
  <form action="https://athiphat-mybackend-01.southeastasia.cloudapp.azure.com/api/product" method="POST" enctype="multipart/form-data">
    <fieldset>
      <legend>General Info</legend>

      <label for="itemName">Item Name</label>
      <input type="text" id="itemName" name="itemName" size="50" />

      <label for="itemDescription">Description</label>
      <textarea id="itemDescription" name="itemDescription" rows="4" cols="50"></textarea>

      <label for="coverImage">Cover Image</label>
      <input type="file" id="coverImage" name="coverImage" />

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="notSpecified" selected>Not Specified</option>
        <option value="consumption">Consumption</option>
        <option value="household">Household</option>
        <option value="electronic">Electronic</option>
        <option value="gadget">Gadget</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Misc.</legend>

      <label for="inventoryAmount">Inventory Amount</label>
      <input type="number" id="inventoryAmount" name="inventoryAmount" />

      <label for="listPrice">List Price</label>
      <input type="number" id="listPrice" name="listPrice" />

      <div>Available Stores</div>
      <label class="inline"><input type="checkbox" name="availableStores[]" value="Bangkok" /> Bangkok</label>
      <label class="inline"><input type="checkbox" name="availableStores[]" value="Pattaya" /> Pattaya</label>
      <label class="inline"><input type="checkbox" name="availableStores[]" value="Phuket" /> Phuket</label>

      <div>Active Status</div>
      <label class="inline"><input type="radio" name="status" value="Active" checked /> Active</label>
      <label class="inline"><input type="radio" name="status" value="Inactive" /> Inactive</label>

      <label for="staffEmail">Staff Email</label>
      <input type="email" id="staffEmail" name="staffEmail" />
    </fieldset>

    <button type="submit">Submit Form</button>
  </form>
</body>
</html>
